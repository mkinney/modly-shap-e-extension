name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Extension contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run validate_extension.py
        run: python validate_extension.py

  # Network-free setup unit tests on three hosted OS images. Does NOT perform
  # real setup/Repair, dependency installation, Modly installation, model
  # loading, or generation - just runs unit tests
  setup-unit-tests:
    name: Setup unit tests (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test_setup.py
        run: python -m unittest test_setup.py -v
